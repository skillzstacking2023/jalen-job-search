name: Notify on job refresh

# Fires automatically whenever jobs.json changes (the daily Claude refresh commit),
# and can also be run by hand from the Actions tab (workflow_dispatch).
# Sends the summary from Arnold's Gmail using an App Password over SMTP.
# Jalen's address lives in the JALEN_EMAIL repo secret, not in this file: the repo is
# public and his dashboard's hygiene rules keep personal contact details off it.
on:
  push:
    paths:
      - 'jobs.json'
  workflow_dispatch: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Build summary and send via Gmail SMTP
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JALEN_EMAIL: ${{ secrets.JALEN_EMAIL }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, smtplib, datetime
          from email.mime.text import MIMEText

          jalen = (os.environ.get('JALEN_EMAIL') or '').strip()
          if not jalen:
              raise SystemExit("Missing JALEN_EMAIL repo secret.")
          RECIPIENTS = ["arbatiste@gmail.com", jalen]

          jobs = json.load(open('jobs.json'))
          high    = [j for j in jobs if j.get('priority') == 'High']
          med     = [j for j in jobs if j.get('priority') == 'Medium']
          stretch = [j for j in jobs if j.get('priority') == 'Stretch']

          today = datetime.date.today().strftime('%A, %B %-d, %Y')
          subject = f"Jalen's Job Dashboard Refreshed - {today}"
          top = '\n'.join(
              f"- {j.get('score')} pts -- {j.get('title')} @ {j.get('company')} ({j.get('city','')})"
              for j in high[:3]
          )
          body = (
              "Hi Jalen,\n\nYour IT job search dashboard was refreshed this morning.\n\n"
              "Today's Summary:\n"
              f"- Total listings: {len(jobs)}\n"
              f"- High Priority: {len(high)}\n"
              f"- Medium Priority: {len(med)}\n"
              f"- Stretch: {len(stretch)}\n\n"
              f"Top Opportunities:\n{top}\n\n"
              "View Dashboard: https://skillzstacking2023.github.io/jalen-job-search/\n\n"
              "Apply to 5-7 tailored roles this week. Quality over volume.\n\n"
              "-- Automated notifier"
          )

          gmail_addr = os.environ.get('GMAIL_ADDRESS')
          app_pw = os.environ.get('GMAIL_APP_PASSWORD')
          if not gmail_addr or not app_pw:
              raise SystemExit("Missing GMAIL_ADDRESS or GMAIL_APP_PASSWORD repo secret.")
          # App Passwords are 16 lowercase letters; Google shows them with spaces
          # and copy-paste can inject non-breaking spaces (\xa0). Keep only the
          # real ASCII alphanumerics so stray whitespace can't break SMTP auth.
          app_pw = "".join(ch for ch in app_pw if ch.isalnum() and ord(ch) < 128)
          gmail_addr = gmail_addr.strip()

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = subject
          msg["From"] = gmail_addr
          msg["To"] = ", ".join(RECIPIENTS)

          ctx = ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls(context=ctx)
              s.login(gmail_addr, app_pw)
              s.send_message(msg, from_addr=gmail_addr, to_addrs=RECIPIENTS)
          print("Email sent to", len(RECIPIENTS), "recipients")
          PY
