name: Notify Jade on job refresh

# Fires when JADE_WILLIAMS/jobs.json changes (Jade's daily refresh commit),
# and can be run by hand from the Actions tab. Sends from Arnold's Gmail via App Password.
# Jade's address lives in the JADE_EMAIL repo secret, not in this file: the repo is
# public and her dashboard's hygiene rules forbid publishing her personal email.
on:
  push:
    paths:
      - 'JADE_WILLIAMS/jobs.json'
  workflow_dispatch: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Build summary and send via Gmail SMTP
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JADE_EMAIL: ${{ secrets.JADE_EMAIL }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, smtplib, datetime
          from email.mime.text import MIMEText

          jade = (os.environ.get('JADE_EMAIL') or '').strip()
          if not jade:
              raise SystemExit("Missing JADE_EMAIL repo secret.")
          RECIPIENTS = [jade, "arbatiste@gmail.com"]

          jobs = json.load(open('JADE_WILLIAMS/jobs.json'))
          high    = [j for j in jobs if j.get('priority') == 'High']
          med     = [j for j in jobs if j.get('priority') == 'Medium']
          stretch = [j for j in jobs if j.get('priority') == 'Stretch']

          # Pay against her $50/hr floor (payMin/payMax are $/hr numbers or null)
          FLOOR = 50
          num = lambda v: isinstance(v, (int, float))
          starts_above = [j for j in jobs if num(j.get('payMin')) and j['payMin'] >= FLOOR]
          reaches = [j for j in jobs if j not in starts_above and num(j.get('payMax')) and j['payMax'] >= FLOOR]
          unpublished = [j for j in jobs if not num(j.get('payMin')) and not num(j.get('payMax'))]

          def pay(j):
              lo, hi = j.get('payMin'), j.get('payMax')
              if num(lo) and num(hi):
                  return f"${lo:.2f}/hr" if lo == hi else f"${lo:.2f}-${hi:.2f}/hr"
              return "pay not published"

          today = datetime.date.today().strftime('%A, %B %-d, %Y')
          subject = f"Jade's Nursing Job Dashboard Refreshed - {today}"
          top = '\n'.join(
              f"- {j.get('score')} pts -- {j.get('title')} @ {j.get('company')} ({j.get('city','')}, {pay(j)})"
              for j in high[:3]
          )
          body = (
              "Hi Jade,\n\nYour perioperative / CVOR nursing job dashboard was refreshed.\n\n"
              "Today's Summary:\n"
              f"- Total listings: {len(jobs)}\n"
              f"- High Priority: {len(high)}\n"
              f"- Medium Priority: {len(med)}\n"
              f"- Stretch: {len(stretch)}\n\n"
              f"Pay vs. your ${FLOOR}/hr floor:\n"
              f"- Start at ${FLOOR}+/hr: {len(starts_above)}\n"
              f"- Range reaches ${FLOOR}/hr: {len(reaches)}\n"
              f"- Pay not published: {len(unpublished)}\n\n"
              f"Top Opportunities:\n{top}\n\n"
              "View Dashboard: https://skillzstacking2023.github.io/jalen-job-search/JADE_WILLIAMS/\n\n"
              "Every listing was confirmed open within the last 3 days.\n\n"
              "-- Automated notifier"
          )

          gmail_addr = os.environ.get('GMAIL_ADDRESS')
          app_pw = os.environ.get('GMAIL_APP_PASSWORD')
          if not gmail_addr or not app_pw:
              raise SystemExit("Missing GMAIL_ADDRESS or GMAIL_APP_PASSWORD repo secret.")
          app_pw = "".join(ch for ch in app_pw if ch.isalnum() and ord(ch) < 128)
          gmail_addr = gmail_addr.strip()

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = subject
          msg["From"] = gmail_addr
          msg["To"] = ", ".join(RECIPIENTS)

          ctx = ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls(context=ctx)
              s.login(gmail_addr, app_pw)
              s.send_message(msg, from_addr=gmail_addr, to_addrs=RECIPIENTS)
          print("Email sent to", len(RECIPIENTS), "recipients")
          PY

      # Short text via T-Mobile's email-to-SMS gateway. Runs after the email and can't fail
      # the job: carrier gateways drop or delay messages without notice, and the email above
      # is the notification of record. Skipped when the JADE_SMS secret isn't set.
      # JADE_SMS holds the full gateway address, e.g. 4105551234@tmomail.net - kept in a
      # secret because the repo is public and her phone number must never be published.
      # ARNOLD_SMS (optional) gets a copy of the same text, sent separately, so Arnold can
      # see what she receives and spot carrier filtering.
      - name: Send text summary (T-Mobile email-to-SMS)
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JADE_SMS: ${{ secrets.JADE_SMS }}
          ARNOLD_SMS: ${{ secrets.ARNOLD_SMS }}
        run: |
          python3 - <<'PY'
          import json, os, re, ssl, smtplib
          from email.mime.text import MIMEText

          targets = [(n, (os.environ.get(n) or '').strip()) for n in ("JADE_SMS", "ARNOLD_SMS")]
          targets = [(n, a) for n, a in targets if a]
          if not targets:
              print("No JADE_SMS or ARNOLD_SMS secret set - skipping text.")
              raise SystemExit(0)

          jobs = json.load(open('JADE_WILLIAMS/jobs.json'))
          num = lambda v: isinstance(v, (int, float))
          high = sum(1 for j in jobs if j.get('priority') == 'High')
          floor = sum(1 for j in jobs if num(j.get('payMin')) and j['payMin'] >= 50)
          top = max(jobs, key=lambda j: j.get('score') or 0) if jobs else None

          head = f"Jade's jobs: {len(jobs)} roles, {high} high fit, {floor} at $50+/hr."
          # No link: T-Mobile silently drops automated gateway texts containing URLs
          # (confirmed 2026-09-29 - a plain manual text arrived, the linked ones never did).
          # The email carries the dashboard link.
          tail = " Details in your email."
          text = head + tail
          if top:
              # Fit the top role in the space left, so the whole text stays one 160-char SMS.
              # Drop the "RN II -" / "Registered Nurse" prefix every title shares.
              title = re.sub(r"^(registered nurse|rn)\b( (i{1,3}|iv))?( \(rn\))?\s*[-,:]?\s*", "", top.get('title', ''), flags=re.I) or top.get('title', '')
              room = 160 - len(text) - len(" Top: ") - len(f" ({top.get('score')}).")
              short = {"Johns Hopkins Medicine": "Hopkins", "University of Maryland Medical System": "UMMS",
                       "MedStar Health": "MedStar", "Department of Veterans Affairs": "VA",
                       "Veterans Health Administration": "VA"}
              co = top.get('company', '')
              co = short.get(co) or re.sub(r"\s+(health( ?care)?|health system|medical (system|center)|medicine)$", "", co, flags=re.I)
              name = f"{co} {title}"  # employer first, so any trimming cuts the end of the title
              if room >= 20:
                  if len(name) > room:
                      name = name[:room - 3].rstrip(" ,-") + "..."
                  text = f"{head} Top: {name} ({top.get('score')}).{tail}"
          text = text.encode('ascii', 'replace').decode()[:160]

          gmail_addr = (os.environ.get('GMAIL_ADDRESS') or '').strip()
          app_pw = "".join(ch for ch in (os.environ.get('GMAIL_APP_PASSWORD') or '') if ch.isalnum() and ord(ch) < 128)
          if not gmail_addr or not app_pw:
              raise SystemExit("Missing GMAIL_ADDRESS or GMAIL_APP_PASSWORD repo secret.")

          ctx = ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls(context=ctx)
              s.login(gmail_addr, app_pw)
              # One message per number, so neither sees the other's number and one bad
              # address can't stop the other text. Logs name the secret, never the number.
              for name, to in targets:
                  # No subject: gateways prepend it to the text, which wastes characters.
                  msg = MIMEText(text, "plain", "us-ascii")
                  msg["From"] = gmail_addr
                  msg["To"] = to
                  try:
                      s.send_message(msg, from_addr=gmail_addr, to_addrs=[to])
                      print(f"Text for {name} handed to the carrier gateway ({len(text)} chars).")
                  except smtplib.SMTPException as e:
                      print(f"Text for {name} was refused: {type(e).__name__}")
          PY
